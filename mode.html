<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>המרדף של קוזין</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081524;font-family:Arial,sans-serif}#game-frame{position:fixed;inset:0;width:100%;height:100%;border:0}
#modebar{display:none;position:fixed;z-index:10000;right:3%;top:calc(env(safe-area-inset-top) + 17%);width:min(35vw,350px);background:#0d2038ee;padding:9px;border:2px solid #e5bd70;border-radius:13px;box-shadow:0 9px 28px #0009;direction:rtl;color:#ffe4a9}
#modebar .title{font-size:clamp(11px,1.3vw,16px);font-weight:900;margin-bottom:7px;text-align:center}#modebar .choices{display:flex;gap:5px}
#modebar button{width:50%;min-width:0;padding:9px 3px;border:1px solid #a68a5d;border-radius:9px;font-weight:800;font-size:clamp(10px,1.15vw,15px);color:#ffe1a2;background:#16273c;touch-action:manipulation}
#modebar button[aria-pressed=true]{background:linear-gradient(#fff1b6,#e8ac3c);color:#101928;border:2px solid #fff6d4}
@media(max-width:650px){#modebar{right:2%;top:16%;width:40vw;padding:5px}#modebar button{padding:7px 1px;font-size:10px}}
</style></head><body>
<iframe id="game-frame" src="/index.html" title="המרדף של קוזין" allow="autoplay;fullscreen" allowfullscreen></iframe>
<div id="modebar" role="group" aria-label="מצב משחק"><div class="title">בחר מצב משחק</div><div class="choices"><button id="regular" type="button" aria-pressed="true">🎮 רגיל</button><button id="online" type="button" aria-pressed="false">🌐 אונליין</button></div></div>
<script>
(()=>{
const frame=document.getElementById('game-frame'),bar=document.getElementById('modebar'),regular=document.getElementById('regular'),online=document.getElementById('online');
let mode='regular',doc=null,observer=null,raf=false;
function select(value){mode=value;regular.setAttribute('aria-pressed',String(value==='regular'));online.setAttribute('aria-pressed',String(value==='online'))}
regular.onclick=()=>select('regular');online.onclick=()=>select('online');
function check(){
 raf=false; if(!doc)return;
 try{
  const start=doc.getElementById('lobbyStart');
  const visible=!!(start&&start.isConnected&&start.getClientRects().length&&!doc.getElementById('overlay')?.classList.contains('hidden'));
  bar.style.display=visible?'block':'none';
 }catch{bar.style.display='none'}
}
function schedule(){if(raf)return;raf=true;requestAnimationFrame(check)}
function watch(){
 let current;try{current=frame.contentDocument;if(!current?.documentElement||current===doc)return;}catch{return}
 observer?.disconnect();doc=current;select('regular');
 // This is capture-phase so online selection intercepts the original start handler.
 doc.addEventListener('click',e=>{
  if(mode!=='online'||!e.target?.closest?.('#lobbyStart'))return;
  e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
  location.assign('/online.html');
 },true);
 doc.addEventListener('keydown',e=>{
  if(mode!=='online'||e.code!=='Enter')return;
  if(e.target?.closest?.('#lobbyStart')||e.target===doc.body){
   e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();location.assign('/online.html');
  }
 },true);
 observer=new MutationObserver(schedule);
 observer.observe(doc.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style','hidden','disabled']});
 schedule();
}
frame.addEventListener('load',watch);watch();
setInterval(()=>{watch();check()},1000);
})();
</script></body></html>
