services:
  - type: web
    name: kozin-online-server
    runtime: node
    plan: free
    region: frankfurt
    rootDir: kozin-online
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://kozin78.vercel.app,https://kozin78-luzo.vercel.app
