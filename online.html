<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1a26">
<title>המרדף של קוזין | אונליין</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#0c1926;color:#fff5db;font-family:Arial,'Noto Sans Hebrew',sans-serif;touch-action:manipulation}button,input,select{font:inherit}button{border:0;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.42;cursor:wait}
#original{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;pointer-events:none}#veil{position:absolute;inset:0;background:linear-gradient(135deg,#08121bee,#112a3cf0);z-index:20;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:20px 14px;overscroll-behavior:contain;touch-action:pan-y}#veil.hidden{display:none}#panel{width:min(510px,100%);border:1px solid #bd9456;border-radius:21px;padding:24px;background:#102332f5;box-shadow:0 20px 65px #000b;text-align:center}h1{font-size:clamp(25px,6vw,38px);margin:3px 0 8px;color:#e9bd6b}p{margin:12px 0}small,.muted{color:#aebfcc;line-height:1.55;font-size:13px}input,select{background:#081824;color:#fff5dc;border:1px solid #5b7280;border-radius:10px;padding:12px;width:100%;max-width:100%;outline:none}input:focus,select:focus{border-color:#dfbd79}label{display:block;text-align:right;margin:12px 0 5px;color:#deccb0;font-size:13px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{display:inline-flex;align-items:center;justify-content:center;background:#f2be63;color:#1a2430;padding:13px 16px;border-radius:11px;font-weight:900;min-height:44px}.btn.dark{background:#1c4053;color:#f4e5c5;border:1px solid #58798a}.btn.ghost{background:transparent;color:#ffe0a8;border:1px solid #a58a60}.btn.wide{width:100%}.actions{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}.actions .btn{flex:1}.room{font-size:33px;letter-spacing:7px;direction:ltr;font-weight:900;color:#83e2ec;margin:8px auto}.status{color:#ffd482;min-height:22px;line-height:1.4;font-size:14px;margin-top:8px}#roomSection{display:none}#waitingPlayers{line-height:1.9}
#hud{position:absolute;top:env(safe-area-inset-top,0px);right:0;left:0;z-index:5;display:none;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;background:#06141fd4;border-bottom:1px solid #e2b87260;color:#fff5dc;font-size:clamp(11px,2.2vw,15px);pointer-events:none}#hud b{font-size:1.1em}#hud .roomMark{color:#ffe3a0}#hud .sub{color:#a8d3df}#touchControls{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:10px;right:10px;z-index:8;display:none;align-items:end;justify-content:space-between;gap:16px;pointer-events:none;direction:ltr}#touchControls button{pointer-events:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;border:2px solid #ffe1a5;background:linear-gradient(#eac16d,#b98740);color:#17232d;border-radius:16px;min-width:72px;min-height:65px;padding:7px 10px;font-weight:900;font-size:17px;box-shadow:0 5px 12px #0008}#touchControls button:active{transform:translateY(2px);background:#fbe4a1}#touchControls .run{width:min(26vw,164px);height:96px;font-size:22px}#attack{display:flex;gap:6px;flex-wrap:wrap;justify-content:end;max-width:58vw;direction:rtl}#attack button{font-size:15px;min-height:61px;min-width:65px}#attack button:nth-child(1){background:#8fe1da}#touchControls button em{display:block;font-size:10px;opacity:.8;font-style:normal}#splash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;color:#fce6c5;background:#0c1926;pointer-events:none}#pauseChip{display:none;position:absolute;z-index:9;top:51px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:13px;background:#102435ec;color:#ffe09d;text-align:center;font-weight:bold;pointer-events:none}a{color:#ffe1a5}#options{display:none}#backLink{font-size:12px;display:inline-block;margin:12px}
@media(max-width:700px) and (orientation:portrait){#touchControls .run{height:82px}#attack button{min-height:60px;min-width:54px;font-size:13px;padding:5px}}
</style>
</head>
<body>
<iframe id="original" src="./index.html" title="הגרפיקה המקורית של המרדף" loading="eager"></iframe>
<div id="splash">טוען את המשחק המקורי…</div>
<div id="hud"><span><b id="hudName">שחקן</b><span class="sub" id="hudDistance"></span></span><span class="roomMark" id="hudRoom"></span><span><b id="hudEnergy">קוזין 100%</b><span class="sub" id="hudFood"></span></span></div>
<div id="pauseChip">ממתינים לחיבור מחדש…</div>
<div id="touchControls"><button class="run" id="runBtn">רוץ<em>החזק</em></button><div id="attack"><button id="powerBtn">כוח<em id="powerClock">מיוחד</em></button><button id="kickBtn">בעיטה</button><button id="punchBtn">אגרוף</button><button id="jumpBtn">קפיצה<em>פעמיים = סלטה</em></button></div></div>
<div id="veil"><div id="panel">
<h1>המרדף של קוזין</h1><p>אונליין · שני חברים בורחים יחד מקוזין</p><p class="muted">אותה גרפיקה ומנוע משחק מקוריים. כל אחד רואה את המצלמה שלו.</p>
<div id="options"><label for="nickname">שם שחקן</label><input id="nickname" placeholder="השם שלך" maxlength="24"><div class="twocol"><div><label for="hero">דמות</label><select id="hero"><option value="luzo">הדר</option><option value="yishai">ישי</option><option value="eyal">אייל</option><option value="moreno">מורנו</option><option value="hashi">האשי</option><option value="yona">יונה</option><option value="tzippy">סבתא</option><option value="michael">מיכאל</option></select></div><div><label for="difficulty">רמת קושי</label><select id="difficulty"><option value="easy">קל</option><option value="normal" selected>בינוני</option><option value="hard">קשה</option><option value="impossible">בלתי אפשרי</option></select></div></div>
<div class="actions"><button class="btn" id="createBtn">צור חדר</button><button class="btn dark" id="joinBtn">הצטרף לחדר</button></div><input id="joinCode" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" placeholder="קוד בן 6 ספרות" dir="ltr" autocomplete="off">
<p class="muted">בגדים וכוחות נלקחים מהמשחק הרגיל. האונליין אינו מעניק או מוציא כסף מהארנק.</p></div>
<div id="roomSection"><p>קוד החדר שלך</p><div id="roomCode" class="room"></div><button class="btn dark wide" id="shareBtn">העתק קישור להזמנת חבר</button><div id="waitingPlayers"></div><div class="actions"><button class="btn" id="readyBtn">אני מוכן</button><button class="btn dark" id="againBtn" style="display:none">משחק חוזר</button></div><button class="btn ghost wide" id="leaveBtn">יציאה מהחדר</button></div>
<div class="status" id="status">מכין את המשחק…</div><a id="backLink" href="./index.html">חזרה למשחק הרגיל</a>
</div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), PROTOCOL='kozin-full-3', URL='wss://kozin-online-server.onrender.com/full-v3', KEY='kozin-multiplayer-v3-session';
const q=new URLSearchParams(location.search);if(/^\d{6}$/.test(q.get('room')||''))$('joinCode').value=q.get('room');
let frame=null,ws=null,profile=null,room=null,session=null,ready=false,running=false,seq=0,held=false,latest=null,remote=null,reconnectTimer=null,reconnectStart=0,stopped=false,manualLeave=false,appReady=false,renderInstalled=false,lastSent=0;
const announce=s=>$('status').textContent=s;
const send=m=>{if(ws?.readyState===WebSocket.OPEN)try{ws.send(JSON.stringify(m));return true}catch{}return false};
const roomView=()=>{$('options').style.display='none';$('roomSection').style.display='block';$('veil').classList.remove('hidden');$('touchControls').style.display='none';$('hud').style.display='none';};
const menuView=()=>{$('options').style.display='block';$('roomSection').style.display='none';$('veil').classList.remove('hidden');$('touchControls').style.display='none';$('hud').style.display='none';room=null;running=false;ready=false;};
const playView=()=>{$('veil').classList.add('hidden');$('touchControls').style.display='flex';$('hud').style.display='flex';$('splash').style.display='none';};
function getOwn(){return latest?.players?.find(p=>p.id===session?.id)}
function saveSession(){if(!session)return;try{sessionStorage.setItem(KEY,JSON.stringify(session))}catch{}}
function clearSession(){session=null;try{sessionStorage.removeItem(KEY)}catch{}}
try{session=JSON.parse(sessionStorage.getItem(KEY)||'null')}catch{clearSession()}
function closeSocket(){const old=ws;ws=null;if(old){old.onclose=null;old.onerror=null;try{old.close(1000)}catch{}}}
function startSocket(onOpen){clearTimeout(reconnectTimer);closeSocket();manualLeave=false;announce('מתחבר לשרת…');try{ws=new WebSocket(URL)}catch(e){announce('כתובת שרת לא תקינה: '+e.message);return}const current=ws;
 ws.onopen=()=>{if(ws!==current)return;announce('מחובר לשרת');onOpen();};
 ws.onmessage=e=>{if(ws!==current)return;let m;try{m=JSON.parse(e.data)}catch{return}onMessage(m)};
 ws.onerror=()=>announce('השרת לא זמין כרגע. מנסה להתחבר…');
 ws.onclose=()=>{if(ws!==current||manualLeave)return;running=false;held=false;$('pauseChip').style.display='block';if(!reconnectStart)reconnectStart=Date.now();const elapsed=Date.now()-reconnectStart;if(session&&elapsed<59000){announce('מחדש חיבור…');reconnectTimer=setTimeout(()=>startSocket(()=>send({type:'resume',protocol:PROTOCOL,code:session.code,id:session.id,token:session.token})),Math.min(4500,800+Math.floor(elapsed/3000)*600));}else{clearSession();reconnectStart=0;$('pauseChip').style.display='none';announce('החיבור נותק. פתחו חדר חדש.');menuView();}};
}
function beginRoom(kind){if(!appReady){announce('המנוע המקורי עוד נטען, נסה שוב בעוד רגע');return}const code=$('joinCode').value.trim();if(kind==='join'&&!/^\d{6}$/.test(code)){announce('צריך להזין קוד חדר בן 6 ספרות');return}clearSession();reconnectStart=0;profile={name:$('nickname').value.trim().slice(0,24)||'שחקן',hero:$('hero').value,gear:{...frame.wardrobe.equipped},difficulty:$('difficulty').value};$('createBtn').disabled=$('joinBtn').disabled=true;startSocket(()=>send({type:kind,protocol:PROTOCOL,...profile,...(kind==='join'?{code}:{})}));setTimeout(()=>{$('createBtn').disabled=$('joinBtn').disabled=false},2400);}
function onMessage(m){
 if(m.type==='hello'){if(m.protocol!==PROTOCOL){announce('גרסת שרת לא תואמת');return}}
 if(m.type==='joined'){session={code:m.code,id:m.id,token:m.token};saveSession();room={code:m.code};reconnectStart=0;ready=false;roomView();$('roomCode').textContent=m.code;announce('מחובר לחדר! מחכה לחבר.');$('pauseChip').style.display='none';}
 if(m.type==='room'){
  room=m;$('roomCode').textContent=m.code;$('waitingPlayers').textContent=(m.players||[]).map(p=>`${p.name} ${p.connected?'●':'◌'} ${p.ready?'✓ מוכן':'ממתין'}`).join('  |  ');ready=!!m.players?.find(p=>p.id===session?.id)?.ready;$('readyBtn').textContent=ready?'מוכן ✓':'אני מוכן';
  if(m.status==='waiting'){running=false;latest=null;remote=null;roomView();$('readyBtn').style.display='inline-flex';$('againBtn').style.display='none';announce('שני שחקנים צריכים ללחוץ ״אני מוכן״');}
  if(m.status==='finished'){running=false;roomView();$('readyBtn').style.display='none';$('againBtn').style.display='inline-flex';}
  if(m.status==='running'){$('pauseChip').style.display=m.paused?'block':'none';if(!m.paused)playView();}
 }
 if(m.type==='started'){running=true;held=false;seq=0;latest=null;remote=null;renderInstalled=false;playView();announce('המרדף התחיל!');sendInput(false);}
 if(m.type==='snapshot'){
  if(!session||m.code!==session.code)return;const wasFinished=latest?.outcome;latest=m;
  if(!frame?.game||!appReady)return;
  if(m.outcome){running=false;held=false;sendInput(false);if(!wasFinished){roomView();$('readyBtn').style.display='none';$('againBtn').style.display='inline-flex';announce(m.outcome.win?'ברחתם מקוזין!':'קוזין תפס שחקן! נסו שוב.');}}
  else{running=true;playView();}
  updateGame(m);updateHud();
 }
 if(m.type==='closed'){announce(m.reason||'החדר נסגר');clearSession();room=null;running=false;setTimeout(()=>menuView(),1200);}
 if(m.type==='error'){announce(m.message||'שגיאה בשרת');if(m.fatal){clearSession();room=null;running=false;menuView();}}
}
function patchRenderer(){if(renderInstalled||!frame)return;const r=frame.renderer,orig=r.draw;renderInstalled=true;
 r.draw=function(g){orig.call(this,g);if(!remote||g.state!=='playing')return;const ownGear=frame.wardrobe.equipped;const other=remote;try{
  frame.wardrobe.equipped=other.gear||{};
  const proxy={...g,wallet:{...g.wallet,selected:other.hero},player:other.player,power:{...g.power,...other.power,carrying:other.power?.type==='tzippy'&&(other.power?.remaining||0)>0,flying:!!other.power?.flying},combat:{...g.combat,...other.combat},input:{running:other.run||false},grace:0};
  this.character(proxy,false);
  this.text(other.name||'שחקן',other.player.x-this.camera,this.ground-(other.player.y||0)-199,17,'#8ef1ff',true);
 }catch(e){if(!this.remoteErrorLogged){console.warn('Kozin remote render error',e);this.remoteErrorLogged=true}}
 finally{frame.wardrobe.equipped=ownGear;}
 };
}
function updateGame(m){const me=m.players.find(p=>p.id===session?.id),other=m.players.find(p=>p.id!==session?.id);if(!me||!frame)return;const g=frame.game;
 if(!g.__onlineStarted){g.difficulty=m.difficulty||'normal';g.start();g.update=()=>{};g.events=[];g.__onlineStarted=true;frame.renderer.reset(g)}
 g.state='playing';g.wallet.selected=me.hero;g.player={...g.player,...me.player};g.power=Object.assign(g.power,me.power||{});
 g.combat=Object.assign(g.combat,me.combat||{});g.combat.enemies=m.enemies||[];g.chaser={...g.chaser,...m.chaser};g.boss=Object.assign(g.boss,m.boss||{});
 g.obstacles=m.obstacles||[];g.foods=m.foods||[];g.mapIndex=m.mapIndex||0;g.distance=me.distance||0;g.time=m.time||0;
 for(const k of ['score','count','combo','maxCombo','hits','missed','cleared','shield','grace','celebration','particles','popups','bubbles'])if(k in me)g[k]=me[k];
 g.input={running:me.run===true,lifting:me.lift===true,clear(){this.running=false;this.lifting=false;}};
 remote=other||null;patchRenderer();
}
function updateHud(){const me=getOwn();if(!me||!latest)return;$('hudName').textContent=me.name||'שחקן';$('hudDistance').textContent=' · '+Math.round(Math.max(0,(me.player?.x||320)-320)/10)+' מ׳';$('hudRoom').textContent='חדר '+session.code;$('hudEnergy').textContent='קוזין '+Math.max(0,Math.round(latest.chaser?.energy||0))+'%';$('hudFood').textContent=' · '+(me.count||0)+' מאכלים';const cooldown=Math.max(0,me.power?.cooldown||0);$('powerClock').textContent=cooldown?Math.ceil(cooldown)+' שנ׳':'מוכן';$('powerBtn').disabled=cooldown>0;}
function sendInput(force){if(!running||!session||!frame)return;const now=Date.now();if(force!==true&&now-lastSent<65)return;lastSent=now;const width=frame.renderer?.width||1000;send({type:'input',seq:++seq,run:held,lift:false,width});}
setInterval(()=>sendInput(false),75);
function hold(v){if(held===v)return;held=v;sendInput(true)}
const run=$('runBtn');run.addEventListener('pointerdown',e=>{e.preventDefault();run.setPointerCapture(e.pointerId);hold(true)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>run.addEventListener(t,e=>{e.preventDefault();hold(false)}));
const act=t=>{if(!running)return;send({type:'action',action:t})};
[['jumpBtn','jump'],['punchBtn','punch'],['kickBtn','kick'],['powerBtn','power']].forEach(([id,a])=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();act(a)}));
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||''))return;if(['ArrowRight','KeyD'].includes(e.code)){e.preventDefault();hold(true)}if(!e.repeat&&['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();act('jump')}if(!e.repeat&&e.code==='KeyS')act('power');if(!e.repeat&&e.code==='KeyK')act('kick');if(!e.repeat&&e.code==='KeyJ')act('punch')});addEventListener('keyup',e=>{if(['ArrowRight','KeyD'].includes(e.code))hold(false)});
function hidden(v){if(running||room?.status==='running'){hold(false);send({type:'away',away:v});$('pauseChip').style.display=v?'block':'none';}}
document.addEventListener('visibilitychange',()=>hidden(document.hidden));addEventListener('pagehide',()=>hidden(true));addEventListener('blur',()=>hold(false));
$('createBtn').onclick=()=>beginRoom('create');$('joinBtn').onclick=()=>beginRoom('join');$('readyBtn').onclick=()=>send({type:'ready',ready:!ready});$('againBtn').onclick=()=>{send({type:'rematch'});$('againBtn').disabled=true;setTimeout(()=>$('againBtn').disabled=false,1200)};
$('shareBtn').onclick=async()=>{const l=new URL(location.href);l.searchParams.set('room',session?.code||'');try{await navigator.clipboard.writeText(l.href);announce('קישור ההזמנה הועתק')}catch{announce('שתף את הקישור: '+l.href)}};
$('leaveBtn').onclick=()=>{manualLeave=true;send({type:'leave'});closeSocket();clearSession();menuView();announce('יצאת מהחדר')};
async function setupFrame(){let attempt=0;while(attempt++<110){try{const f=$('original').contentWindow;const bridge=f.eval('({game,renderer,assets,wardrobe,controls})');if(bridge?.game&&bridge?.renderer&&bridge.assets.loaded&&bridge.wardrobe){frame=bridge;appReady=true;$('splash').style.display='none';$('options').style.display='block';$('nickname').value=bridge.game.wallet?.name||'שחקן';$('hero').value=bridge.game.wallet?.selected||'luzo';$('difficulty').value=bridge.game.difficulty||'normal';const css=f.document.createElement('style');css.textContent='#overlay,#hud,#subhud,#controls,#notice,#bossStatus{display:none!important}html,body{touch-action:none!important}';f.document.head.appendChild(css);announce('המנוע המקורי נטען. אפשר לפתוח חדר.');if(session?.token&&/^\d{6}$/.test(session.code||'')){startSocket(()=>send({type:'resume',protocol:PROTOCOL,...session}));}return;}}catch(e){if(attempt===110)announce('לא ניתן לטעון את המשחק המקורי: '+e.message)}await new Promise(r=>setTimeout(r,350))}announce('טעינת המשחק נכשלה. בדוק ש־index.html קיים באותו אתר.');}
setupFrame();
})();
</script>
</body>
</html>
