name: Live Render Multiplayer Check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/online-live-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-two-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: kozin-online
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node live-smoke.mjs
