name: Kozin full online verification
on:
  push:
    paths:
      - "kozin-online/**"
      - "online.html"
      - "index.html"
      - ".github/workflows/kozin-full-online-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install game server dependencies
        run: npm ci --prefix kozin-online || npm install --prefix kozin-online
      - name: Run online client syntax check
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('online.html').read_text(encoding='utf-8')
          code=html.split('<script>')[-1].split('</script>')[0]
          Path('/tmp/kozin-online-client.js').write_text(code,encoding='utf-8')
          assert 'id="resultView"' in html
          assert 'r.drawInterpolated=function' in code
          assert 'renderInstalled=false' in code
          print('Online client source and result overlay found')
          PY
          node --check /tmp/kozin-online-client.js
      - name: Verify browser controls are visible and clickable
        run: node kozin-online/full-v3/browser-controls-test.mjs
      - name: Verify Create Room with real browser and server failure
        run: node kozin-online/full-v3/browser-room-create-test.mjs
      - name: Verify real game art and teammate in Chromium
        run: node kozin-online/full-v3/browser-game-render-test.mjs
      - name: Run original-world multiplayer tests
        run: node kozin-online/full-v3/test.mjs
      - name: Verify online rewards and reconnect receipts
        run: node kozin-online/full-v3/rewards-test.mjs
      - name: Verify account roster and cross-iframe ownership
        run: node kozin-online/full-v3/client-test.mjs
      - name: Benchmark live world and network snapshot cost
        run: node kozin-online/full-v3/perf.mjs
      - name: Run real two-client WebSocket smoke test
        shell: bash
        run: |
          set -eo pipefail
          PORT=9087 KOZIN_SMOKE_ON_START=0 npm start --prefix kozin-online > /tmp/kozin-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true; cat /tmp/kozin-server.log' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9087/full-v3/health > /dev/null; then break; fi
            sleep 0.5
          done
          node kozin-online/full-v3/live-test.mjs ws://127.0.0.1:9087/full-v3
      - name: Check deployed production WebSocket room
        shell: bash
        run: |
          set -eo pipefail
          for i in $(seq 1 45); do
            if curl --max-time 8 -fsS https://kozin-online-server.onrender.com/full-v3/health | grep -q '"ok":true'; then break; fi
            sleep 2
          done
          node kozin-online/full-v3/live-test.mjs wss://kozin-online-server.onrender.com/full-v3

      - name: Verify live server physics rate and active deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            health="$(curl -sSfL --max-time 8 https://kozin-online-server.onrender.com/full-v3/health || true)"
            if [[ "$health" == *'"tickHz":60'* && "$health" == *'"snapshotHz":20'* ]]; then
              echo "PASS live Render version: $health"
              exit 0
            fi
            echo "Waiting for production server update: attempt $attempt"
            sleep 3
          done
          echo "Render did not deploy the verified 60 Hz multiplayer server."
          exit 1
