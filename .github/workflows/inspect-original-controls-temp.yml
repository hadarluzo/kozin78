name: Inspect Kozin Original Controls
on:
  push:
    branches: [fix/restore-online-player-and-controls-20261020]
    paths: ['.github/workflows/inspect-original-controls-temp.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Extract styling and coordinates from original
      shell: bash
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import re
        raw=Path('index.html').read_text(encoding='utf8')
        terms=['#controls','#touch','#jumpBtn','#runBtn','id="controls"','id="runBtn"','id="jumpBtn"','id="jump"','id="move"','id="controlsLeft"','requestAnimationFrame','pointerdown','class="run"','class="jump"','touch-action']
        out=['File length: '+str(len(raw))]
        hits=[]
        for term in terms:
          for m in re.finditer(re.escape(term),raw,re.I):
            hits.append((m.start(),term))
        out.append('Hits: '+str(len(hits)))
        seen=set()
        for i,term in sorted(hits):
          if i//600 in seen: continue
          seen.add(i//600)
          if len(seen)>45: break
          out.append('\\n==== '+str(i)+' '+term+' ====\\n'+raw[max(0,i-400):i+1350])
        Path('kozin-online/original-controls-research.txt').write_text('\\n'.join(out)[:90000],encoding='utf8')
        print('Detected',len(hits),'occurrences')
        PY
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add kozin-online/original-controls-research.txt
        git commit -m "Record original game control positions for online layout" && git push || true
