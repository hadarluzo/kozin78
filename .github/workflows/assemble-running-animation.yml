name: Assemble corrected running animation
on:
  push:
    branches: [codex/running-animation-fix]
    paths:
      - kozin-online/new-heroes/render.js
      - kozin-online/new-heroes/*-run.webp
      - kozin-online/full-v3/browser-new-heroes-test.mjs
      - .github/workflows/assemble-running-animation.yml
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build from canonical source
        run: python3 kozin-online/new-heroes/build.py
      - run: npm ci --prefix kozin-online
      - name: Verify animation, cosmetics and gameplay
        run: |
          node kozin-online/full-v3/browser-new-heroes-test.mjs
          node kozin-online/full-v3/browser-game-render-test.mjs
          node kozin-online/full-v3/test.mjs
          node kozin-online/full-v3/new-heroes-test.mjs
      - name: Commit verified browser build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Build corrected Michael and Savta running cycles'
            git push origin HEAD:codex/running-animation-fix
          fi
