name: Kozin Multiplayer Smoke Test
on:
  push:
    branches: [main]
    paths:
      - 'online.html'
      - 'kozin-online/**'
      - '.github/workflows/online-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: kozin-online
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node smoke-test.mjs
